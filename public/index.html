<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Connect with Alexandra</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/config.js"></script>
  <script src="/app.js" defer></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
</head>
<body>
  <main class="card">
    <h1>Connect with <span id="name">Alexandra</span> via</h1>

    <a id="linkedin" class="btn btn-linkedin" href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    <button id="show-email" class="btn btn-email" type="button">CV via email</button>

    <form id="email-form" hidden novalidate>
      <label for="email">Your email</label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="254" placeholder="you@company.com">
      <!-- Honeypot: hidden from people, bots tend to fill it in -->
      <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div id="turnstile"></div>
      <button class="btn btn-email" type="submit">Send me the CV</button>
      <p class="fineprint">Your email is only used to send you the CV.</p>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
